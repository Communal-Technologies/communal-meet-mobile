name: communal_meet
description: "Conferences and chat between a cooperative and its members."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The fleet's set, same major versions as collector_mobile.
  dio: ^5.9.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.3
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^7.1.1
  intl: ^0.20.3

  # Meet's own: the chat socket, the outbox and cache, retry-safe send ids, and
  # the empty-state glyphs.
  web_socket_channel: ^3.0.3
  sqflite: ^2.4.1
  uuid: ^4.5.3
  flutter_svg: ^2.2.4

  # The store-update check: Play's in-app updates on Android, the App Store
  # version compared against the bundle's on iOS. shared_preferences carries
  # the "already asked about this version" note, which is not a secret and so
  # does not belong in flutter_secure_storage.
  in_app_update: ^4.2.5
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3

  # The meeting: the LiveKit protocol itself (flutter_webrtc arrives with it),
  # the camera and microphone prompts, the join and knock sounds, and the screen
  # that must not sleep while somebody is talking.
  livekit_client: ^2.11.0
  # Held at 11.x with the Wallet app. permission_handler_android 14 is built for
  # AGP 9 / Kotlin 2.3.20 / compileSdk 37 and its Gradle script does not compile
  # against this toolchain at all.
  permission_handler: ^11.3.1
  audioplayers: ^6.7.1
  wakelock_plus: ^1.3.3

  # Android's screen capture only runs under a mediaProjection foreground
  # service, and this package is the one that declares it — livekit_client's own
  # example depends on it for exactly that. Nothing else in the app uses it.
  flutter_background: ^1.3.1

  # firebase_core, firebase_messaging and flutter_callkit_incoming arrive with
  # 1:1 ringing (PLAN.md step 7). Adding them now would make every build depend
  # on a google-services.json that does not exist yet, for a screen nothing
  # reaches.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# The same mark as the member and collector apps, with the ground inverted:
# white on #742CE7, because Meet is the third Communal icon in the same drawer.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher_icon.png"
  background_color_android: "#742CE7"
  adaptive_icon_background: "#742CE7"
  adaptive_icon_foreground: "assets/images/launcher_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
